<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Mona Ayad, Flutter Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3D91"/>
      <stop offset="0.55" stop-color="#2A7DE1"/>
      <stop offset="1" stop-color="#7B4DFF"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.18"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'Consolas', 'Courier New', monospace; font-weight: 700; fill: #ffffff; opacity: 0.22; }
    .float1 { animation: float 6s ease-in-out infinite; }
    .float2 { animation: float 8s ease-in-out infinite reverse; }
    .float3 { animation: float 7s ease-in-out infinite 1s; }
    .phone  { animation: float 5s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }

    .line { opacity: 0; animation: cycle 9s ease-in-out infinite; }
    .l2 { animation-delay: 3s; }
    .l3 { animation-delay: 6s; }
    @keyframes cycle {
      0%   { opacity: 0; transform: translateY(12px); }
      5%   { opacity: 1; transform: translateY(0); }
      28%  { opacity: 1; transform: translateY(0); }
      33%  { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 0; }
    }

    .accent { transform-box: fill-box; transform-origin: left; animation: grow 3s ease-in-out infinite; }
    @keyframes grow { 0%,100% { transform: scaleX(0.35); } 50% { transform: scaleX(1); } }

    .bar { transform-box: fill-box; transform-origin: left; animation: fill 3.6s ease-in-out infinite; }
    .b2 { animation-delay: 0.5s; }
    .b3 { animation-delay: 1s; }
    @keyframes fill { 0%,100% { transform: scaleX(0.3); } 50% { transform: scaleX(1); } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <circle cx="1080" cy="30" r="170" fill="#ffffff" opacity="0.07"/>
    <circle cx="560" cy="340" r="130" fill="#ffffff" opacity="0.06"/>

    <!-- floating code symbols -->
    <g class="float1"><text class="mono" x="620" y="86" font-size="40">{ }</text></g>
    <g class="float2"><text class="mono" x="690" y="272" font-size="38">&lt;/&gt;</text></g>
    <g class="float3"><text class="mono" x="815" y="160" font-size="40">=&gt;</text></g>
    <g class="float1"><text class="mono" x="850" y="60" font-size="34">[ ]</text></g>

    <!-- text -->
    <text x="72" y="92" font-size="22" font-weight="600" letter-spacing="6" fill="#CFE3FF">HI, I'M</text>
    <text x="68" y="176" font-size="84" font-weight="800" fill="#ffffff">Mona Ayad</text>
    <rect class="accent" x="72" y="196" width="150" height="6" rx="3" fill="#FFD24A"/>

    <text class="line" x="72" y="256" font-size="32" font-weight="600" fill="#ffffff">Flutter Developer</text>
    <text class="line l2" x="72" y="256" font-size="32" font-weight="600" fill="#ffffff">I turn ideas into apps</text>
    <text class="line l3" x="72" y="256" font-size="32" font-weight="600" fill="#ffffff">Teaching code on Instagram  @ayad.trojan</text>

    <!-- phone -->
    <g class="phone">
      <g transform="translate(965,30) rotate(5 75 130)">
        <rect width="150" height="264" rx="26" fill="#0D1B3D" stroke="#ffffff" stroke-width="4"/>
        <rect x="52" y="8" width="46" height="8" rx="4" fill="#ffffff" opacity="0.5"/>
        <rect x="10" y="22" width="130" height="232" rx="18" fill="#F4F8FF"/>
        <rect x="10" y="22" width="130" height="38" rx="18" fill="#2A7DE1"/>
        <rect x="10" y="44" width="130" height="16" fill="#2A7DE1"/>
        <rect x="24" y="36" width="54" height="8" rx="4" fill="#ffffff"/>
        <g>
          <rect x="20" y="74" width="110" height="46" rx="10" fill="#ffffff" stroke="#D6E4FA"/>
          <circle cx="40" cy="97" r="11" fill="#7B4DFF"/>
          <rect class="bar" x="58" y="90" width="60" height="6" rx="3" fill="#2A7DE1"/>
          <rect x="58" y="102" width="40" height="5" rx="2.5" fill="#B9CCE8"/>
        </g>
        <g>
          <rect x="20" y="130" width="110" height="46" rx="10" fill="#ffffff" stroke="#D6E4FA"/>
          <circle cx="40" cy="153" r="11" fill="#FFD24A"/>
          <rect class="bar b2" x="58" y="146" width="60" height="6" rx="3" fill="#2A7DE1"/>
          <rect x="58" y="158" width="40" height="5" rx="2.5" fill="#B9CCE8"/>
        </g>
        <g>
          <rect x="20" y="186" width="110" height="46" rx="10" fill="#ffffff" stroke="#D6E4FA"/>
          <circle cx="40" cy="209" r="11" fill="#1FB5A6"/>
          <rect class="bar b3" x="58" y="202" width="60" height="6" rx="3" fill="#2A7DE1"/>
          <rect x="58" y="214" width="40" height="5" rx="2.5" fill="#B9CCE8"/>
        </g>
      </g>
    </g>
  </g>
</svg>
